name: 'Site Scrub'
description: >-
  AI-assisted SEO & meta review for static sites. Scans built HTML with Cheerio,
  sends a compact report to an AI model (Claude, GPT, or Gemini), posts a sticky
  PR comment on pull requests and opens a weekly audit issue on scheduled/manual runs.
author: 'Datum Cloud'
branding:
  icon: 'search'
  color: 'blue'

inputs:
  provider:
    description: "AI provider: 'anthropic' (default), 'openai', or 'gemini'."
    required: false
    default: 'anthropic'
  api-key:
    description: 'API key for the selected provider.'
    required: false
    default: ''
  anthropic-api-key:
    description: 'Deprecated — use `api-key` (kept for backward compatibility with provider: anthropic).'
    required: false
    default: ''
  base-url:
    description: 'Optional API base URL override (e.g. an OpenAI-compatible gateway like OpenRouter or Groq together with provider: openai).'
    required: false
    default: ''
  site-url:
    description: 'Production origin of the site (e.g. https://www.example.com). Used to recognise internal links and render absolute links in the report.'
    required: true
  dist-dir:
    description: 'Directory containing the built HTML output.'
    required: false
    default: 'dist'
  pages-dir:
    description: 'Source directory whose files map 1:1 to routes (used for changed-file detection and broken-link validation).'
    required: false
    default: 'src/pages'
  content-dir:
    description: 'Content-collection directory whose files map to routes (used for changed-file detection).'
    required: false
    default: 'src/content'
  scan-mode:
    description: "'auto' (changed-only on pull_request, full otherwise), 'changed-only', or 'full'."
    required: false
    default: 'auto'
  config-file:
    description: 'Optional path to a JSON config with excludePaths / excludeFiles / excludeFilePatterns.'
    required: false
    default: ''
  broad-change-pattern:
    description: 'Optional regex; when a changed file matches it, the PR scan is skipped as a "broad change". Defaults to an Astro-oriented pattern (layouts, components, styles, config).'
    required: false
    default: ''
  model:
    description: 'Model id override (defaults to the model pinned in the action for the selected provider).'
    required: false
    default: ''
  max-pages:
    description: 'Cap on pages analyzed (0 = unlimited).'
    required: false
    default: '0'
  github-token:
    description: 'Token used to post the PR comment and manage the weekly audit issue.'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Install action dependencies
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund

    - name: Collect changed page files (PR only)
      if: github.event_name == 'pull_request'
      id: changed
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PAGES_DIR: ${{ inputs.pages-dir }}
        CONTENT_DIR: ${{ inputs.content-dir }}
      run: |
        set -euo pipefail
        # The PR merge-ref checkout does not always contain base.sha, so a bare
        # `git diff "$BASE_SHA"` dies with "fatal: bad object". Fetch both commits
        # explicitly, then diff with merge-base (three-dot) semantics. No `|| true`:
        # a broken diff must fail the job, not silently report "no changes".
        git fetch --no-tags --quiet origin "$BASE_SHA" "$HEAD_SHA"
        changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- "$PAGES_DIR/**" "$CONTENT_DIR/**")"
        {
          echo 'files<<EOF'
          printf '%s\n' "$changed"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Resolve scan mode
      id: mode
      shell: bash
      env:
        REQUESTED: ${{ inputs.scan-mode }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        case "$REQUESTED" in
          changed-only|full)
            echo "value=$REQUESTED" >> "$GITHUB_OUTPUT"
            ;;
          auto|"")
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "value=changed-only" >> "$GITHUB_OUTPUT"
            else
              echo "value=full" >> "$GITHUB_OUTPUT"
            fi
            ;;
          *)
            echo "::warning::Unknown scan-mode '$REQUESTED', defaulting to auto."
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "value=changed-only" >> "$GITHUB_OUTPUT"
            else
              echo "value=full" >> "$GITHUB_OUTPUT"
            fi
            ;;
        esac

    - name: Fetch previous audit body (for trend arrows)
      if: github.event_name != 'pull_request'
      id: prev
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        # Most recent site-scrub issue in any state (closed by next run, but could still be open).
        prev_body="$(gh issue list --label site-scrub --state all --limit 1 --json body --jq '.[0].body // ""' || echo '')"
        delimiter="SITESCRUB_$(openssl rand -hex 8)"
        {
          echo "body<<${delimiter}"
          printf '%s\n' "$prev_body"
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"

    - name: Run SITE Scrub
      shell: bash
      env:
        AI_PROVIDER: ${{ inputs.provider }}
        AI_API_KEY: ${{ inputs.api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        AI_MODEL: ${{ inputs.model }}
        AI_BASE_URL: ${{ inputs.base-url }}
        SCAN_MODE: ${{ steps.mode.outputs.value }}
        CHANGED_FILES: ${{ steps.changed.outputs.files }}
        DIST_DIR: ${{ inputs.dist-dir }}
        SITE_URL: ${{ inputs.site-url }}
        PAGES_DIR: ${{ inputs.pages-dir }}
        CONTENT_DIR: ${{ inputs.content-dir }}
        SEO_CONFIG: ${{ inputs.config-file }}
        BROAD_CHANGE_PATTERN: ${{ inputs.broad-change-pattern }}
        MAX_PAGES: ${{ inputs.max-pages }}
        OUTPUT_FILE: .tmp/site-scrub.md
        PREVIOUS_AUDIT_BODY: ${{ steps.prev.outputs.body }}
      run: node "$GITHUB_ACTION_PATH/site-scrub.mjs"

    - name: Post or update PR comment
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        header: site-scrub-bot
        path: .tmp/site-scrub.md
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Open audit issue
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        DATE="$(date -u +%Y-%m-%d)"
        TITLE="Site Scrub — ${DATE}"
        BODY_FILE=".tmp/site-scrub.md"
        # Ensure label exists (idempotent).
        gh label create site-scrub --color BFD4F2 --description "Weekly Site Scrub audit reports" 2>/dev/null || true
        # Close any older open audit issues to keep the list tidy.
        gh issue list --label site-scrub --state open --json number,title \
          --jq '.[] | select(.title != "'"$TITLE"'") | .number' \
          | xargs -r -I{} gh issue close {} --comment "Superseded by ${TITLE}." || true
        gh issue create \
          --title "$TITLE" \
          --label site-scrub \
          --body-file "$BODY_FILE"
